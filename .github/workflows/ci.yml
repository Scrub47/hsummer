name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/audit-deps.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          # Public values are inlined at build time. Placeholders keep the
          # smoke test from ever calling a real Supabase project.
          NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: your-publishable-or-anon-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: your-vapid-public-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

  # Local Supabase on the GitHub runner. RLS first, then the circle
  # Playwright flow. The smoke tests stay in the check job and keep using
  # placeholder keys, so they never call this stack or a hosted project.
  # Mailpit stays up so the test sign-in can mint a magic link. Studio,
  # analytics, and realtime are not needed.
  rls:
    name: RLS and local e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start --yes -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run test:rls
      - name: Export local Supabase keys
        run: node scripts/print-local-supabase-env.mjs --github-env >> "$GITHUB_ENV"
      - name: Build against local Supabase
        run: npm run build
        env:
          # Public values are inlined at build time. The Supabase URL and
          # publishable key come from the previous step and are local.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: your-vapid-public-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:local
        env:
          CI: true
          E2E_TEST_AUTH: "1"

  # Full history. A finding fails the job. The allowlist is only the
  # synthetic push key in a unit test. Do not rewrite history from CI.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --config .gitleaks.toml
